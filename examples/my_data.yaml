# 数据集配置模板
# 复制到 <yolov5>/data/my_data.yaml，然后按自己的数据修改。
#
# 重要：names 的顺序就是标签里 cls 字段的数字。
#       它必须与训练该权重时使用的顺序完全一致，否则索引错位、结果全错。
#       （check_dataset.py 会在训练前帮你校验这一条）

# 数据集根目录。可以是绝对路径，也可以是相对 yolov5 根目录的路径。
path: ../datasets/my_data

# 下面两条相对于 path
train: images/train
val: images/val

# 类别数
nc: 2

# 类别名（索引: 名称）
names:
  0: cat
  1: dog
